[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fair-ly-accurate"
version = "0.4.0"
description = "Fair-ly accurate text synonyms for data cleaning: authority-aware synonym collapsing and normalization of FAIR / DataCite metadata fields."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "FAIR Data Innovations Hub" }]
keywords = ["FAIR", "DataCite", "metadata", "normalization", "synonyms", "entity-resolution", "ROR", "clustering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.21",
]

[project.optional-dependencies]
graph = ["networkx>=3", "python-louvain>=0.16"]
# Semantic clustering (embeddings + HDBSCAN). Kept optional so the deterministic
# cleaners, ROR index and I/O install light.
cluster = [
  "scikit-learn>=1.3",
  "sentence-transformers>=2.2",
]
# Geocoding-based place normalization.
geo = [
  "geopy>=2.3",
]
# Faster/retry-friendly download for `build-ror-index --latest`. Optional: the
# fetcher falls back to the standard library when requests is absent.
ror = [
  "requests>=2.25",
]
all = [
  "scikit-learn>=1.3",
  "sentence-transformers>=2.2",
  "geopy>=2.3",
  "requests>=2.25",
]
dev = [
  "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/fairdataihub/fair-ly-accurate-text-synonyms-for-data-cleaning"
Repository = "https://github.com/fairdataihub/fair-ly-accurate-text-synonyms-for-data-cleaning"

[project.scripts]
fairly = "fairly.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fairly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
