name: Publish

# Build, then publish to PyPI via Trusted Publishing (OIDC) — no API tokens stored.
# Triggered when you publish a GitHub Release (which carries a vX.Y.Z tag).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Verify the release tag matches the package version
        run: |
          pkg_version="$(ls dist/*.tar.gz | sed -E 's#.*/fair_ly_accurate-(.*)\.tar\.gz#\1#')"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "package=$pkg_version  tag=$tag_version"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $pkg_version. Bump the version in pyproject.toml and src/fairly/__init__.py before tagging."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fair-ly-accurate
    permissions:
      id-token: write        # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
